    <style>

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 75px; }
        header { position: sticky; top: 0; background: rgba(11, 15, 20, 0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.2rem; letter-spacing: 2px; color: var(--accent-gold); text-transform: uppercase; font-weight: 700; }
        .search-container { padding: 12px 16px; }
        .search-input { width: 100%; padding: 12px 16px; background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 0.95rem; outline: none; }
        .search-input:focus { border-color: var(--accent-gold); }
        .grid { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 0 16px 16px 16px; }
        @media (min-width: 640px) { .grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); } }
        .card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .yacht-rank { font-size: 0.8rem; color: var(--accent-gold); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .yacht-name { font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin-top: 2px; }
        .yacht-meta { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
        .badge { font-size: 0.75rem; padding: 3px 8px; background: rgba(212, 175, 55, 0.15); color: var(--accent-gold); border: 1px solid var(--accent-gold); border-radius: 4px; font-weight: 600; }
        .details-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.85rem; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 10px 0; }
        .detail-item { display: flex; flex-direction: column; }
        .detail-item.full-width { grid-column: span 2; }
        .detail-label { color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-value { color: var(--text-main); font-weight: 500; margin-top: 2px; }
        .owner-link { color: var(--accent-gold); text-decoration: none; border-bottom: 1px dotted var(--accent-gold); }
        .owner-link:hover { color: var(--accent-gold-hover); border-bottom-style: solid; }
        .card-actions { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background-color: transparent; color: var(--text-main); font-weight: 600; font-size: 0.85rem; cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background-color: var(--accent-gold); color: #000; border: none; }
        .btn-bookmark.active { color: var(--accent-gold); border-color: var(--accent-gold); background: rgba(212, 175, 55, 0.1); }
        nav { position: fixed; bottom: 0; width: 100%; background-color: var(--bg-card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-item { color: var(--text-muted); font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; }
        .nav-item.active { color: var(--accent-gold); font-weight: 600; }
        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 200; flex-direction: column; }
        .modal.active { display: flex; }
        .video-container { position: relative; flex: 1; overflow: hidden; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 220px; height: 220px; border: 2px dashed var(--accent-gold); border-radius: 16px; pointer-events: none; }
        .close-modal { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: #fff; border: 1px solid var(--border); width: 44px; height: 44px; border-radius: 22px; font-size: 1.2rem; cursor: pointer; z-index: 210; }
    </style>

    <main class="grid" id="yacht-grid"></main>

    <nav>
        <button class="nav-item active" onclick="switchTab('all', this)"><span>Fleet Index</span></button>

        <button class="nav-item" onclick="switchTab('saved', this)"><span>Saved (<span id="saved-count">0</span>)</span></button>

        <div class="video-container">
