    <style>
        :root {
            --bg-main: #0b0f14;
            --bg-card: #161b22;
            --border: #30363d;
            --accent-gold: #d4af37;
            --accent-gold-hover: #f3e5ab;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --danger: #f85149;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 75px;
        }

        header {
            position: sticky;
            top: 0;
            background: rgba(11, 15, 20, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 16px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--accent-gold);
            text-transform: uppercase;
            font-weight: 700;
        }

        .search-container {
            padding: 12px 16px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-gold);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            padding: 0 16px 16px 16px;
        }

        @media (min-width: 640px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            }
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .yacht-rank {
            font-size: 0.8rem;
            color: var(--accent-gold);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .yacht-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 2px;
        }

        .yacht-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            background: rgba(212, 175, 55, 0.15);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            border-radius: 4px;
            font-weight: 600;
        }

        .details-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 10px 0;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-item.full-width {
            grid-column: span 2;
        }

        .detail-label {
            color: var(--text-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            color: var(--text-main);
            font-weight: 500;
            margin-top: 2px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: transparent;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
        }

        .btn-primary:active {
            background-color: var(--accent-gold-hover);
        }

        .btn-bookmark.active {
            color: var(--accent-gold);
            border-color: var(--accent-gold);
            background: rgba(212, 175, 55, 0.1);
        }

        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-gold);
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 200;
            flex-direction: column;
        }

        .modal.active {
            display: flex;
        }

        .video-container {
            position: relative;
            flex: 1;
            overflow: hidden;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            border: 2px dashed var(--accent-gold);
            border-radius: 16px;
            pointer-events: none;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: 22px;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 210;
        }
    </style>
</head>
<body>

    <header>
        <h1>YachtSpotter</h1>
        <span id="fleet-count" class="badge">Top 100 Largest</span>
    </header>

    <div class="search-container">
        <input type="text" id="search" class="search-input" placeholder="Search by yacht, owner, builder, flag, or MMSI..." oninput="filterYachts()">
    </div>

    <main class="grid" id="yacht-grid"></main>

    <nav>
        <button class="nav-item active" onclick="switchTab('all', this)">
            <span>Fleet Index</span>
        </button>

        <button class="nav-item" onclick="openCamera()">
            <span>Visual Scanner</span>
        </button>

        <button class="nav-item" onclick="switchTab('saved', this)">
            <span>Saved (<span id="saved-count">0</span>)</span>
        </button>
    </nav>

    <!-- Camera Modal Overlay -->
    <div id="camera-modal" class="modal">
        <button class="close-modal" onclick="closeCamera()">✕</button>
        <div class="video-container">
            <video id="webcam" autoplay playsinline></video>
            <div class="crosshair"></div>
        </div>
    </div>

        let savedIds = JSON.parse(localStorage.getItem('saved_yachts') || '[]');
        let currentTab = 'all';

        function updateSavedCount() {
            document.getElementById('saved-count').innerText = savedIds.length;
        }

        function toggleSave(id) {
            if (savedIds.includes(id)) {
                savedIds = savedIds.filter(i => i !== id);
            } else {
                savedIds.push(id);
            }
            localStorage.setItem('saved_yachts', JSON.stringify(savedIds));
            updateSavedCount();
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('yacht-grid');
            const search = document.getElementById('search').value.toLowerCase();
            
            grid.innerHTML = '';

            const filtered = yachts.filter(y => {
                const matchesSearch = y.name.toLowerCase().includes(search) || 
                                     y.owner.toLowerCase().includes(search) || 
                                     y.builder.toLowerCase().includes(search) ||
                                     y.flag.toLowerCase().includes(search) ||
                                     y.mmsi.includes(search);
                const matchesTab = currentTab === 'all' || savedIds.includes(y.id);
                return matchesSearch && matchesTab;
            });

            filtered.forEach(y => {
                const isSaved = savedIds.includes(y.id);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="yacht-rank">#${y.rank} Largest</div>
                            <div class="yacht-name">${y.name}</div>
                            <div class="yacht-meta">${y.builder} • ${y.year}</div>
                        </div>
                        <span class="badge">${y.length}</span>
                    </div>

                    <div class="details-list">
                        <div class="detail-item full-width">
                            <span class="detail-label">Beneficial Owner</span>
                            <span class="detail-value">${y.owner}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Flag State</span>
                            <span class="detail-value">${y.flag}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">MMSI / IMO</span>
                            <span class="detail-value">${y.mmsi} / ${y.imo}</span>
                        </div>
                    </div>

                    <div class="card-actions">
                        <a href="https://www.marinetraffic.com/en/ais/details/ships/mmsi:${y.mmsi}" 
                           target="_blank" rel="noopener noreferrer" class="btn btn-primary">Live Satellite GPS</a>
                        <button class="btn btn-bookmark ${isSaved ? 'active' : ''}" onclick="toggleSave('${y.id}')">
                            ${isSaved ? 'Saved' : 'Bookmark'}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterYachts() {
            renderGrid();
        }

        function switchTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            if(el) el.classList.add('active');
            renderGrid();
        }

        async function openCamera() {
            const modal = document.getElementById('camera-modal');
            const video = document.getElementById('webcam');
            modal.classList.add('active');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
            } catch (err) {
                alert("Camera access denied or unavailable.");
                closeCamera();
            }
        }

        function closeCamera() {
            const modal = document.getElementById('camera-modal');
            const video = document.getElementById('webcam');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            modal.classList.remove('active');
        }

        updateSavedCount();
        renderGrid();
    </script>
