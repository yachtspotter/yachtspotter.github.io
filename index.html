<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yachtspotter: a DEEP pocket directory</title>
  <style>
    :root {
      --bg: #09111e;
      --card-bg: #0f1c2e;
      --card-border: #1a2b42;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --accent-blue: #00b2fe;
      --gold-bg: rgba(217, 119, 6, 0.12);
      --gold-border: rgba(217, 119, 6, 0.35);
      --gold-text: #fbbf24;
      --badge-bg: #14273e;
      --badge-text: #00b2fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Top Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .anchor-icon {
      color: #f59e0b;
      font-size: 2rem;
    }

    .title-text h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      line-height: 1.1;
    }

    .title-text h1 span {
      color: var(--accent-blue);
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .subtitle b {
      color: #ef4444;
      font-weight: 800;
    }

    .save-btn {
      background: rgba(15, 28, 46, 0.8);
      border: 1px solid var(--gold-border);
      color: var(--gold-text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Search Controls */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 240px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 16px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .search-input::placeholder {
      color: #475569;
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #09111e;
    }

    /* Yacht Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .yacht-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .yacht-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
    }

    .length-badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(0, 178, 254, 0.2);
    }

    .owner-section {
      margin-bottom: 12px;
    }

    .owner-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .owner-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--gold-bg);
      border: 1px solid var(--gold-border);
      color: var(--gold-text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s ease;
    }

    .owner-btn:hover {
      background: rgba(217, 119, 6, 0.25);
    }

    .description {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="header">

      <div class="title-text">
        <h1>yachtspotter</h1>

      </div>
    </div>
    <button class="save-btn" onclick="alert('Tap your browser share button and select Add to Home Screen')">Save to Phone 📱</button>

    <input type="text" id="searchInput" class="search-input" placeholder="Search yacht or owner..." oninput="filterDirectory()">

      <button class="pill" onclick="setFilter('heavy', this)">80m–99m</button>

  </div>

  <div class="grid" id="yachtGrid"></div>

      { name: "Opera", length: 146, category: "giga", owner: "Sheikh Abdullah Al Nahyan", bioLink: "https://www.superyachtfan.com/yacht/opera/", desc: "Built by Lürssen. Minister of Foreign Affairs of UAE." },
      { name: "Pelorus", length: 115, category: "giga", owner: "Samuel Tak Lee", bioLink: "https://www.superyachtfan.com/yacht/pelorus/", desc: "Built by Lürssen. Hong Kong property billionaire." },
      { name: "Yas", length: 141, category: "giga", owner: "Hamdan bin Zayed Al Nahyan", bioLink: "https://www.superyachtfan.com/yacht/yas/", desc: "Built by ADMShipyards. Converted frigate superyacht." }
    ];

    let currentFilter = 'all';

    function renderGrid(data) {
      const grid = document.getElementById("yachtGrid");
      grid.innerHTML = "";
      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "yacht-card";
        card.innerHTML = `
          <div>
            <div class="card-top">
              <div class="yacht-name">${item.name}</div>
              ${item.length > 0 ? `<div class="length-badge">${item.length}m</div>` : ''}
            </div>
            <div class="owner-section">
              <div class="owner-label">OWNER</div>
              <a href="${item.bioLink}" target="_blank" rel="noopener" class="owner-btn">
                ${item.owner} ↗
              </a>
            </div>
            <div class="description">${item.desc}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function setFilter(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      filterDirectory();
    }

    function filterDirectory() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = fleet.filter(item => {
        const matchesQuery = item.name.toLowerCase().includes(query) || item.owner.toLowerCase().includes(query);
        const matchesCat = (currentFilter === 'all') || (item.category === currentFilter);
        return matchesQuery && matchesCat;
      });
      renderGrid(filtered);
    }

    // Initial Render
    renderGrid(fleet);
  </script>
</body>
</html>
