<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yachtspotter: a DEEP pocket directory</title>
  <style>
    :root {
      --bg-color: #0b131f;
      --card-bg: #132238;
      --accent: #00d2ff;
      --text-main: #e0e6ed;
      --text-muted: #8a99ad;
      --border: #1c3352;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 32px auto;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: -0.5px;
      margin: 0 0 8px 0;
      color: #fff;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 24px;
    }

    .search-bar {
      width: 100%;
      max-width: 480px;
      padding: 12px 18px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
    }

    .search-bar:focus {
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .yacht-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .yacht-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .yacht-name {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 6px 0;
      color: #fff;
    }

    .owner-name {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin: 0 0 16px 0;
    }

    .card-links {
      display: flex;
      gap: 12px;
      margin-top: auto;
    }

    .btn-link {
      display: inline-block;
      flex: 1;
      text-align: center;
      padding: 8px 12px;
      background: rgba(0, 210, 255, 0.08);
      color: var(--accent);
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(0, 210, 255, 0.2);
    }

    .btn-link:hover {
      background: var(--accent);
      color: #0b131f;
    }
  </style>
</head>
<body>

  <header>
    <h1>yachtspotter: a DEEP pocket directory</h1>
    <div class="tagline">Interactive Fleet Index & Verified Ownership Directory</div>
    <input type="text" id="searchInput" class="search-bar" placeholder="Search by yacht or owner..." onkeyup="filterDirectory()">
  </header>

  <div class="grid" id="yachtGrid"></div>

  <script>
    const fleet = [
      {
        name: "Aquijo",
        owner: "Jürgen Großmann",
        bioLink: "https://www.superyachtfan.com/yacht/aquijo/owner/",
        yachtLink: "https://y.co/yacht/aquijo"
      },
      {
        name: "Imagine",
        owner: "Sergey Godin",
        bioLink: "https://en.wikipedia.org/wiki/Serge_Godin",
        yachtLink: "https://www.superyachtfan.com/yacht-industry/yacht-builders/trinity/"
      },
      {
        name: "Galatea (renamed Taurica)",
        owner: "Undisclosed Private Owner",
        bioLink: "https://www.superyachtfan.com/yacht/taurica/",
        yachtLink: "https://www.yachtbuyer.com/en/fleet/taurica-131-heesen"
      },
      {
        name: "Carinthia VII",
        owner: "Rubén Cherñajovsky",
        bioLink: "https://www.superyachtfan.com/yacht/carinthia-vii/",
        yachtLink: "https://www.superyachtfan.com/yacht/carinthia-vii/"
      },
      {
        name: "Zen",
        owner: "Wu Guangming",
        bioLink: "https://www.superyachtfan.com/yacht/zen/owner/",
        yachtLink: "https://www.superyachtfan.com/yacht/zen/"
      },
      {
        name: "Kaos (ex-Jubilee)",
        owner: "Nancy Walton Laurie",
        bioLink: "https://www.superyachtfan.com/yacht/kaos/",
        yachtLink: "https://www.superyachtfan.com/yacht/kaos/"
      },
      {
        name: "Secret",
        owner: "Sri Prakash Lohia",
        bioLink: "https://www.superyachtfan.com/yacht/sea-pearl-2013/owner/",
        yachtLink: "https://www.superyachtfan.com/yacht/sea-pearl-2013/"
      },
      {
        name: "Coral Ocean",
        owner: "Ian Malouf",
        bioLink: "https://www.superyachtfan.com/yacht/coral-ocean/owner/",
        yachtLink: "https://www.superyachtfan.com/yacht/coral-ocean/"
      },
      {
        name: "Velsheda",
        owner: "Ronald de Waal",
        bioLink: "https://www.superyachtfan.com/yacht/bystander/owner/",
        yachtLink: "https://www.superyachtfan.com/yacht/bystander/"
      },
      {
        name: "Patrick Getreide (OAK Collection)",
        owner: "Patrick Getreide",
        bioLink: "https://www.forbes.com/sites/robertanaas/2022/05/13/one-watch-collector-160-rare-watches-patek-rolex-oak-collection-opens-next-week/",
        yachtLink: "https://www.forbes.com/sites/robertanaas/2022/05/13/one-watch-collector-160-rare-watches-patek-rolex-oak-collection-opens-next-week/"
      },
      {
        name: "Irimari (renamed Almax)",
        owner: "Alexandr Holdings Ltd / Private",
        bioLink: "https://www.superyachtfan.com/yacht/irimari/",
        yachtLink: "https://www.boatinternational.com/yacht-market-intelligence/brokerage-sales-news/sunrise-motor-yacht-irimari-for-sale"
      }
    ];

    function renderGrid(data) {
      const grid = document.getElementById("yachtGrid");
      grid.innerHTML = "";
      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "yacht-card";
        card.innerHTML = `
          <div>
            <div class="yacht-name">${item.name}</div>
            <div class="owner-name">Owner: ${item.owner}</div>
          </div>
          <div class="card-links">
            <a href="${item.bioLink}" target="_blank" rel="noopener" class="btn-link">Owner Bio</a>
            <a href="${item.yachtLink}" target="_blank" rel="noopener" class="btn-link">Yacht Page</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterDirectory() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = fleet.filter(item => 
        item.name.toLowerCase().includes(query) || 
        item.owner.toLowerCase().includes(query)
      );
      renderGrid(filtered);
    }

    // Initial Render
    renderGrid(fleet);
  </script>
</body>
</html>
